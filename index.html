<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LT climbing team</title>
<meta name="theme-color" content="#1C262C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LT climbing">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF0; --panel:#FFFFFF; --ink:#1C262C; --soft:#5E6B73; --line:#CBD3D8; --acc:#2F6FD1; --pos:#35A071; --neg:#D23F63; --field:#F3F6F8; --today:#1C262C; --todayInk:#fff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A1E; --panel:#1E262B; --ink:#E6ECEF; --soft:#93A1A9; --line:#34414A; --field:#263036; --today:#E6ECEF; --todayInk:#141A1E;
}}
:root[data-theme="dark"]{--bg:#141A1E; --panel:#1E262B; --ink:#E6ECEF; --soft:#93A1A9; --line:#34414A; --field:#263036; --today:#E6ECEF; --todayInk:#141A1E}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.02em;color:var(--soft)}
.sync{font-size:.8rem;color:var(--soft)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.9rem}
.month{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 10px}
.month h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:2.6rem;line-height:1;margin:0;letter-spacing:-.01em}
.month h1 span{color:var(--soft);font-weight:500;font-size:1.5rem;margin-left:6px}
.arrows{display:flex;gap:6px}
.arrows button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:1.2rem;line-height:1}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font-size:.75rem;color:var(--soft);text-align:center;padding-bottom:2px;font-weight:600}
.day{position:relative;aspect-ratio:1/1.12;background:var(--panel);border:1px solid transparent;border-radius:8px;padding:5px 5px 0;display:flex;flex-direction:column;align-items:flex-start;overflow:hidden;text-align:left}
.day.out{visibility:hidden}
.day .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.05rem;line-height:1}
.day.today .n{background:var(--today);color:var(--todayInk);border-radius:4px;padding:1px 4px;margin:-1px -2px}
.day.sel{border-color:var(--ink)}
.tapes{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:2px;padding:0 4px 4px}
.tape{height:6px;border-radius:2px;transform:skewX(-14deg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 2px 18px;font-size:.85rem;color:var(--soft)}
.legend i{display:inline-block;width:18px;height:6px;border-radius:2px;transform:skewX(-14deg);margin-right:6px;vertical-align:middle}
.dayhead{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.5rem;margin:6px 0 10px}
.adds{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
.add{border:0;border-radius:10px;min-height:48px;padding:10px 12px;font-weight:600;color:#fff;background:var(--c);text-align:left;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.add:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.18)}
.add:disabled{opacity:.6}
.add.light{color:#1C262C}
.entry{background:var(--panel);border-radius:10px;margin-bottom:10px;border-left:8px solid var(--c);overflow:hidden}
.ehead{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.ehead b{font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;font-weight:700}
.ehead small{color:var(--soft);font-size:.85rem}
.ebody{padding:0 14px 14px}
.f{margin-bottom:12px}
.f label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
textarea,input[type=text],input[type=time],input[type=number],select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:none}
textarea{min-height:40px;overflow:hidden}
.sleep{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sleep input{flex:1;min-width:0}
.dur{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.1rem;min-width:62px;text-align:right}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.lrow label{margin:0}
.now{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600;min-height:34px;white-space:nowrap}
.stamp{display:flex;align-items:center;gap:2px}
.stamp input,.li input[type=time]{width:auto;flex:0 0 auto;padding:5px 8px}
.x{border:0;background:none;color:var(--soft);min-width:34px;min-height:34px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:6px}
.lbtn{flex:1;min-width:0;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:10px 12px;font-weight:600;min-height:44px}
.li.done .lbtn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.blocks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.blk{display:flex;align-items:center;gap:4px;background:var(--field);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:4px 2px 4px 10px}
.blk b{font-weight:600}
.blk input[type=time]{width:auto;padding:4px 6px;background:var(--panel)}
.sw.pick{position:relative;display:grid;place-items:center;background:conic-gradient(#D23F63,#E3B31C,#35A071,#2F6FD1,#8E52CC,#D23F63);color:#fff;font-weight:800;overflow:hidden}
.sw.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pills{display:flex;gap:6px;margin-bottom:12px}
.pills button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:600;min-height:38px}
.pills button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--panel);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.3rem;margin:0 0 8px}
.find{display:block;width:100%;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.find p{margin:0 0 6px;font-weight:500}
.meta{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--soft);flex-wrap:wrap}
.badge{border-radius:4px;padding:1px 6px;font-weight:700;font-size:.72rem;letter-spacing:.02em;text-transform:uppercase}
.b-solid{background:#35A071;color:#fff}.b-poss{background:#E3B31C;color:#1C262C}.b-hint{background:var(--line);color:var(--ink)}
.bar{flex:0 0 70px;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:3px}
.chart{width:100%;height:auto;display:block;margin-top:6px;color:var(--ink)}
.chart .ax{fill:var(--soft);font-size:10px;font-family:"Barlow",sans-serif}
.chart .gl{stroke:var(--line);stroke-width:1}
.aiout{white-space:pre-wrap;margin-top:10px;line-height:1.5}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 12px}
.tabs button{flex:1 1 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 8px;font-weight:600;font-size:.82rem;min-height:40px;color:var(--ink);white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.chip.best{border-color:var(--pos);color:var(--ink)}
.bignum{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:3.4rem;line-height:1;margin:4px 0 6px}
.bignum small{font-size:1.4rem;color:var(--soft);font-weight:500;margin-left:6px}
.crow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:0}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0}
.prog i{display:block;height:100%;background:var(--pos)}
.hist{border-bottom:1px solid var(--line);padding:8px 0}
.hist summary{cursor:pointer;font-weight:600}
.hist ul{margin:8px 0 0;padding-left:18px}
.key{display:inline-flex;align-items:center;gap:4px}.key i{width:14px;height:3px;display:inline-block}
.mini.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbl{background:none;border:0;padding:4px 0;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:4px;min-height:34px}
.lbl span{color:var(--soft);font-size:.75rem}
.typesw{display:flex;gap:6px;margin:2px 0 8px}
.typesw button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:5px 14px;font-weight:600;font-size:.85rem;min-height:34px}
.typesw button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--soft);margin-top:5px;min-height:0}
.qm:empty{display:none}
.qtip{flex-basis:100%;line-height:1.35}
.qbar{display:inline-flex;gap:2px}.qbar i{width:12px;height:6px;border-radius:2px;display:block}
.qdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.qcell{display:flex;align-items:center;gap:8px}
.plan{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.plan:last-of-type{border-bottom:0}
.seg{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px}
.seg button{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px 4px;font-weight:600;min-height:44px}
.seg button small{display:block;font-weight:700;font-size:.8rem}
.seg button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.btn:disabled{opacity:.55}
.bars{margin-top:8px}
.brow{display:grid;grid-template-columns:minmax(84px,auto) 1fr auto auto;align-items:center;gap:8px;padding:3px 0;font-size:.85rem}
.brow .bt{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.brow .bt i{display:block;height:100%;background:var(--acc);opacity:.55}
.brow.best .bt i{background:var(--pos);opacity:1}.brow.best .bl,.brow.best b{color:var(--pos)}
.order{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:10px 12px;border-radius:8px;margin-bottom:8px;background:var(--field);border-left:5px solid var(--line)}
.order .note{grid-column:2}.otag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--soft);white-space:nowrap}
.order.oa{border-left-color:var(--pos)}.order.ob{border-left-color:var(--acc)}.order.ol{border-left-color:#8E52CC}.order.oi{border-left-color:#E3B31C}
.strip{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0}.strip i{width:14px;height:14px;border-radius:3px;display:block;border:1.5px solid transparent}
.strip i.sA{background:rgba(53,160,113,.35)}.strip i.sB{background:rgba(47,111,209,.3)}
.strip i.sA.got{background:var(--pos)}.strip i.sB.got{background:var(--acc)}.strip i.now{border-color:var(--ink)}
.picker{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;margin:2px 0 10px}
.pk{display:flex;flex-wrap:wrap;gap:6px}
.pk button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;font-weight:600;font-size:.85rem;min-height:40px;text-align:left}
.pk button i{width:10px;height:10px;border-radius:50%;background:var(--rc);flex:0 0 auto}
.pk button small{color:var(--rc);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.02em}
.pk button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.fcq button{flex:1 1 44%}
.setdef{margin-top:8px;border:1px dashed var(--line);background:none;border-radius:8px;padding:8px 10px;font-weight:600;font-size:.85rem;width:100%;min-height:40px}
.setdef.on{border-style:solid;color:var(--pos)}
.rdot{flex:0 0 12px;height:12px;border-radius:50%}
.scale.s11{grid-template-columns:repeat(11,1fr)}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.flags button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem;min-height:38px}
.flags button.on{background:#C0392B;color:#fff;border-color:#C0392B}
.alert{border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:500;line-height:1.4}
.alert.red{background:rgba(210,63,99,.12);border:1px solid #D23F63;color:var(--ink)}
.alert.amber{background:rgba(227,179,28,.14);border:1px solid #E3B31C;color:var(--ink)}
.flash{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.step{display:inline-flex;align-items:center;gap:10px}.step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-size:1.3rem;font-weight:700}
.step b{min-width:24px;text-align:center;font-size:1.2rem}
.card.pack{border:1.5px solid var(--acc)}
.tline{display:flex;align-items:center;gap:8px;padding:4px 0}.tline i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.quick button{border:1px dashed var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem;min-height:36px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg2 button{border:0;background:var(--panel);padding:8px 10px;font-weight:700;font-size:.8rem;min-height:40px}.seg2 button.on{background:var(--ink);color:var(--bg)}
.plaus{margin:6px 0 0;font-size:.85rem;font-weight:600;color:#B7791F}
.anc{margin:4px 0 0;font-size:.8rem;color:var(--soft);min-height:1em}
.nonebtn{border:1px dashed var(--line);background:none;border-radius:8px;padding:8px 12px;font-weight:600;font-size:.85rem;min-height:40px;margin-bottom:8px}
.nonebtn.on{border-style:solid;border-color:var(--pos);color:var(--pos)}
.pq{margin-top:6px}.pq .note{margin:8px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 11px;font-weight:600;font-size:.82rem;min-height:36px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fgrow{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:6px;margin-bottom:6px}.fgrow>span{font-size:.8rem;font-weight:700;color:var(--soft)}
.fch{font-family:"Barlow Condensed",sans-serif;font-size:1.15rem;margin:14px 0 0;border-top:1px solid var(--line);padding-top:10px}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}.wnav span{font-weight:700;text-align:center}
.wsec{border-top:1px solid var(--line)}.wsec summary{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;cursor:pointer;font-weight:700;list-style:none;min-height:44px}
.wsec summary::-webkit-details-marker{display:none}.wsec summary span::before{content:'▸';display:inline-block;width:14px;color:var(--soft)}.wsec[open] summary span::before{content:'▾'}
.wsec summary b{font-weight:600;color:var(--soft)}.wsec>.crow,.wsec>p{margin-left:14px}
.frow{display:grid;grid-template-columns:minmax(90px,38%) 1fr 10px;align-items:center;gap:10px;width:100%;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:6px;min-height:48px}
.frow .fname{font-weight:700}.frow .fsum{color:var(--ink);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frow.empty .fsum{color:var(--soft)}
.frow .fdot{width:10px;height:10px;border-radius:50%}
.fopen{border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px 8px;margin:4px 0 10px;background:var(--panel)}
.fopen .f{margin-bottom:6px}.fnav{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.eprog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 8px}.eprog i{display:block;height:100%;background:var(--c)}
details.more{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}details.more summary{cursor:pointer;color:var(--soft);font-weight:600;font-size:.9rem;min-height:40px;display:flex;align-items:center}
.cw{position:relative}.hit{fill:transparent;cursor:pointer;stroke:none}.hit.sel{stroke:var(--ink);stroke-width:2;fill:rgba(0,0,0,.04)}
.tip{font-size:.85rem;font-weight:600;margin:4px 0 0;min-height:1.3em;color:var(--ink)}
.snav{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px 4px;scrollbar-width:none}.snav::-webkit-scrollbar{display:none}
.snav button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.82rem;min-height:36px}
.anchor{scroll-margin-top:calc(12px + env(safe-area-inset-top,0px))}
.card.slim{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.card.slim>div:first-child{display:flex;flex-direction:column}
.fhead{display:block;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit}
.fhead p{margin:0 0 6px;font-weight:500}
.fcard2{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin-bottom:14px}
.fcard2 .lrow{margin-bottom:6px}.fcard2 .fl{font-weight:700;font-size:1.02rem}
.fmt{border:0;background:none;color:var(--soft);font-weight:600;font-size:.82rem;padding:6px 2px;min-height:34px;text-decoration:underline;text-underline-offset:3px}
.comp{margin-top:8px}.comp:first-of-type{margin-top:2px}
.clab{margin:0 0 4px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
.fcard2 textarea,.fcard2 input[type=text],.fcard2 input[type=number],.fcard2 input[type=time]{background:var(--panel)}
.fcard2 .scale button{background:var(--panel)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}.yn button{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-height:44px;font-weight:700}
.yn button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cfield{border-top:1px solid var(--line);padding:10px 0}.cfield:first-of-type{border-top:0}
.cparts{margin-top:6px}.cparts button{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;padding:4px 10px;min-height:32px}

function bootApp(ACC,TEAM){

const VTYPES=Object.keys(TYPES);
const isFood=n=>/maist|food|valg|meal/i.test(String(n||''))&&!/papild|supp|vitam/i.test(String(n||''));
const sleepLike=n=>/mieg|sleep/i.test(String(n||''));
const nowHM=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const sortC=a=>CORDER.filter(c=>a.includes(c));
function compsOf(x){ if(!x) return ['T']; if(x.type==='mix'){ const c=sortC((x.comps||[]).filter(c=>COMP[c])); return c.length?c:['T']; } return (LEG[x.type]||'T').split(''); }
function compsList(it){ const c=compsOf(it); if(it.at&&!c.includes('C')) c.push('C'); return sortC(c); }
function getP(it,c){ if(c==='C') return it.at||''; const t=it.type, v=it.val, o=(v&&typeof v==='object'&&!Array.isArray(v))?v:{};

  return undefined; }
function toMix(it){ if(it.type==='mix') return; const cs=compsOf(it), nv={}; cs.forEach(c=>{ const x=getP(it,c); if(x!==undefined) nv[c]=x; }); it.type='mix'; it.comps=cs; it.val=nv; }
function setP(it,c,val){ if(c==='C'){ it.at=val||''; return; } toMix(it); it.val=Object.assign({},it.val); if(val===undefined) delete it.val[c]; else it.val[c]=val; }
function toggleComp(it,c){ toMix(it); const cs=it.comps.slice(); it.stash=Object.assign({},it.stash||{});
  if(cs.includes(c)){ if(cs.length<=1) return false; it.stash[c]=c==='C'?it.at:it.val[c]; if(c==='C') it.at=''; else { it.val=Object.assign({},it.val); delete it.val[c]; } it.comps=cs.filter(x=>x!==c); }
  else { it.comps=sortC(cs.concat(c)); if(it.stash[c]!==undefined){ if(c==='C') it.at=it.stash[c]; else it.val=Object.assign({},it.val,{[c]:it.stash[c]}); delete it.stash[c]; } }
  return true; }
const blank=f=>{ if(f.type==='mix'){ const v={}; if((f.comps||[]).includes('L')) v.L=(f.opts||[]).map(n=>({id:rid(),name:n,at:''})); return v; }
  const t=f.type; return t==='scale'?null:t==='text'?'':t==='list'?(f.opts||[]).map(n=>({id:rid(),name:n,at:''})):t==='blocks'?[]:t==='both'?{n:null,t:''}:(t==='sleep'||t==='range')?{}:t==='rangeScale'?{n:null}:t==='all'?{n:null,t:''}:t==='load'?{e:null,m:''}:t==='pain'?{p:null,where:'',flags:{}}:t==='flash'?{t:0,f:0}:t==='number'?{v:''}:''; };
function newItem(f){ const it={fid:f.id,name:f.name,type:f.type,val:blank(f)}; if(f.type==='mix') it.comps=(f.comps||[]).slice(); return it; }
function filledPart(it,c){ const x=getP(it,c);
  switch(c){ case 'R': return !!(x&&(x.from||x.to)); case 'C': return !!x; case 'S': case 'K': return typeof x==='number'&&(c==='S'||x>0); case 'T': return !!(x&&String(x).trim());
    case 'N': case 'D': return x!==''&&x!=null&&!isNaN(parseFloat(x)); case 'Y': return x===true||x===false;
    case 'B': return (Array.isArray(x)&&x.length>0)||!!it.none; case 'L': return (Array.isArray(x)&&x.some(y=>y.at))||!!it.none;
    case 'E': return !!(x&&(typeof x.e==='number'||(x.m!==''&&x.m!=null))); case 'P': return !!(x&&typeof x.p==='number'); case 'F': return !!(x&&+x.t>0);
    case 'M': return !!(x&&MOM.some(([m])=>Object.keys(snapVals(x[m])).length)); case 'V': return Array.isArray(x)&&x.length>0; case 'G': return Array.isArray(x)&&x.length>0; }
  return false; }
const filledItem=it=>compsList(it).some(c=>filledPart(it,c));
// ---------- quality v3: the format you choose AND what you put in it both count ----------
function formatScore(name,cs){ const R=compRatings(name), hit=R.best.filter(c=>cs.includes(c)).length/R.best.length, poor=cs.filter(c=>(R.rate[c]??1)===0).length;
  return Math.max(0.2,Math.min(1,0.2+0.8*Math.pow(hit,1.5)-0.1*poor)); }
const fmtLevel=f=>f>=0.9?4:f>=0.7?3:f>=0.5?2:f>=0.35?1:0;
function scoreHistory(name,date){ return cached('SH:'+nk(name)+':'+date,()=>{ const out=[]; for(let i=1;i<=21&&out.length<7;i++){ const d=dAdd(date,-i), [y,m,dd]=d.split('-'), mo=S.months[`${y}-${m}`];
  ((mo&&mo.days&&mo.days[String(+dd)])||[]).forEach(e=>(e.items||[]).forEach(it=>{ if(nk(it.name)!==nk(name)||!compsList(it).includes('S')) return; const x=getP(it,'S'); if(typeof x==='number') out.push(x); })); } return out; }); }
function partScore(it,c,prev){ const x=getP(it,c), plaus=plausible(it);
  switch(c){
    case 'T': { const q=quality(x,it.name,prev); if(q) return {s:q.s,tip:q.tip,q}; const ft=(TIPS.find(([re])=>re.test(it.name||''))||[0,'what happened, why, and how much'])[1]; return {s:0,tip:`Write the text: ${/[.?!]$/.test(ft)?ft:ft+'.'}`}; }
    case 'S': { if(typeof x!=='number') return {s:0,tip:'Pick a 1–10 score.'}; const h=scoreHistory(it.name,S.sel||todayStr); if(h.length>=5&&h.every(y=>y===x)) return {s:60,tip:`You gave ${x} every day lately. Use the whole scale so real changes show up.`}; return {s:100}; }
    case 'R': { if(!x||!x.from||!x.to) return {s:x&&(x.from||x.to)?40:0,tip:'Fill in both times.'}; return plaus&&/times/.test(plaus)?{s:20,tip:plaus}:{s:100}; }
    case 'C': return x?(plaus&&/later than now/.test(plaus)?{s:30,tip:plaus}:{s:100}):{s:0,tip:'Add the time (tap Now).'};
    case 'N': return x!==''&&x!=null&&!isNaN(parseFloat(x))?(plaus&&/usual/.test(plaus)?{s:30,tip:plaus}:{s:100}):{s:0,tip:'Enter the result.'};
    case 'D': return x!==''&&x!=null&&!isNaN(parseFloat(x))?(plaus&&/minutes/.test(plaus)?{s:30,tip:plaus}:{s:100}):{s:0,tip:'Enter the minutes.'};

    case 'V': return Array.isArray(x)&&x.length?{s:100}:{s:0,tip:'Tap a score to add it at the current time.'};

      if(!(o.fingers||[]).length) return {s:55,tip:'Which finger hurts? Tap it.'}; if(o.p>=3&&!(o.when||[]).length&&!(o.grip||[]).length) return {s:80,tip:'When does it hurt, and on which grip?'}; return {s:100}; }

function itemQuality(it,prev){ if(!it) return null; const cs=compsList(it); if(!cs.some(c=>filledPart(it,c))) return null;

function weekdayChart(t){ const s=Array(7).fill(0),c=Array(7).fill(0); for(const d in t.vals){ const w=(new Date(d+'T12:00').getDay()+6)%7; s[w]+=t.vals[d]; c[w]++; }

function timingPatterns(t,V){ const out=[];

// ---------- scientist ----------
// Method: hypotheses come from "sweet spots" in your own data (best range of each thing you control, checked with a
// permutation test and a false-discovery correction). Each hypothesis is then tested as an N-of-1 trial with randomized
// A/B days (each pair of days has one A and one B in random order), analysed with a randomization test. A difference only
// counts if it is bigger than the smallest worthwhile change (0.3 x your normal day-to-day spread). Confirmed hypotheses
// become "laws" that keep getting re-checked on new data, so a setting that stops working gets flagged.
function isControllable(v){ return /^(it|itt|sl|sb|sw|at|log|ld|dr|ts|te|yn|ct|mn):/.test(v.key); }
function aiErrText(e){ const c=e&&e.code; return c==='cancelled'?'':c==='not_granted'?'The scientist needs your permission. Tap again to allow it.':c==='rate_limited'?'Too many requests right now. Try again in a minute.':c==='prompt_too_large'?'Too much data at once.':'Something went wrong. Try again.'; }
function rng(seed){ let a=0; for(const c of String(seed)) a=(Math.imul(a,31)+c.charCodeAt(0))|0; return ()=>{ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const sdev=a=>{ if(a.length<2) return 0; const m=mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); };

  for(let i=0;i<n;i++){ const a=x1[i]-m1,b=x2[i]-m2,c=y[i]-my; s11+=a*a; s22+=b*b; s12+=a*b; s1y+=a*c; s2y+=b*c; }

const goalRank=v=>v.key.startsWith('avg:')?0:v.key==='ov:all'?1:/^(fl|tp|fs):/.test(v.key)?2:3;
const goalOptions=ds=>ds.vars.filter(v=>v.kind==='num'&&/^(ov|s|avg|sq|fl|tp|nm|vs|fs):/.test(v.key)).sort((a,b)=>goalRank(a)-goalRank(b)||simpleName(a).localeCompare(simpleName(b)));
function goalVar(ds){ const O=goalOptions(ds), want=S.coach.goal||'', fk=want.split(':').pop();
  if(!S.coach.goalMig&&/^v?s:/.test(want)){ const av=O.find(v=>v.key==='avg:'+fk); S.coach.goalMig=1; if(av){ S.coach.goal=av.key; saveCoach(); return av; } }
  return O.find(v=>v.key===want)||(fk&&(O.find(v=>v.key==='avg:'+fk)||O.find(v=>v.fam==='s:'+fk||v.fam==='vs:'+fk)))||O.find(v=>v.key==='ov:all')||O.find(v=>/energ/i.test(v.label))||O[0]||null; }

const SLEEPY=k=>/^(sl|sb|sw):/.test(k);

function wsec(title,summary,body,open){ const O=S.st.wopen||(S.st.wopen=new Set(['Overview','Sleep','Training','Body'])); const isO=O.has(title)||(open&&!S.st.wtouched); return `<div class="wsec"><button class="wsh" data-ws="${esc(title)}" aria-expanded="${isO}"><span>${isO?'▾':'▸'} ${title}</span><b>${summary}</b></button>${isO?`<div class="wbody">${body}</div>`:''}</div>`; }
const crow=(l,v,c)=>`<div class="crow"><span>${l}</span><b${c?` style="color:${c}"`:''}>${v}</b></div>`;
function weekCard(){ const off=S.st.wk||0, s=weekStats(off); const lt=S.st.wl==='lt', txt=weekText(s,lt); S.st.weekTxt=txt;

    (t.prev&&t.load>t.prev*1.3?'<p class="note">Load jumped over 30% from last week. Build up gradually; big jumps are when fingers get hurt.</p>':''),true); }
  if(s.flash.T) out+=wsec('Problems',`${Math.round(s.flash.F/s.flash.T*100)}% flash · ${Math.round(s.flash.O/s.flash.T*100)}% top`,crow('Tried · flashed · topped',`${s.flash.T} · ${s.flash.F} · ${s.flash.O}`)+(s.flash.A?crow('Attempts in total',`${s.flash.A}${s.flash.OA?` <span class="note">(${Math.round(s.flash.A/s.flash.OA*10)/10} per top)</span>`:''}`):'')+crow('Flash rate',`${Math.round(s.flash.F/s.flash.T*100)}%${s.flashP.T?` <span class="note">(week before ${Math.round(s.flashP.F/s.flashP.T*100)}%)</span>`:''}`)+crow('Top rate',`${Math.round(s.flash.O/s.flash.T*100)}%${s.flashP.T?` <span class="note">(week before ${Math.round(s.flashP.O/s.flashP.T*100)}%)</span>`:''}`));

  if(s.body&&s.body.length){ out+=wsec('Body',`${s.body.filter(x=>x.n).length} sore`,s.body.slice(0,12).map(x=>crow(`${esc(x.g)}${x.where?`<br><span class="note">${esc(x.where)}</span>`:''}`,`${x.n?`sore ${x.n} day${x.n>1?'s':''}${x.p?`, pain ${x.p}`:''}`:'tired'} <span class="note">worst ${x.max}</span>`,x.p?'var(--neg)':x.n?'#B7791F':'var(--ink)')).join(''),true); }

// ---------- take your data to Claude ----------
const WDLT=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
let XDAY=null; // the log day being exported (so a body rating filled in on a later day says when)
function partText(it,c){ const x=getP(it,c);

    case 'V': { const a=(Array.isArray(x)?x:[]).slice().sort((p,q)=>(p.at||'')<(q.at||'')?-1:1); return a.length?'scores through the day: '+a.map(y=>`${y.at||'?'} ${y.n??'?'}/10${y.note?` ("${y.note}")`:''}`).join(', '):''; }
    case 'N': return x!==''&&x!=null?`result ${x}`:'';

    case 'G': { const a=Array.isArray(x)?x.slice().sort((p,q)=>(p.at||'')<(q.at||'')?-1:1):[]; if(!a.length) return '';
      return 'routes: '+a.map((y,i)=>`#${i+1} ${String(y.g||'').trim()||'grade ?'}${y.at?` at ${y.at}`:''}: ${+y.a||1} attempt${(+y.a||1)>1?'s':''}, ${y.top===true?'topped':y.top===false?'not topped':'top not marked'}, ${y.fl===true?'flashed':y.fl===false?'not flashed':'flash not marked'}${y.dur!=null&&y.dur!==''?`, ${y.dur} min on it`:''}${String(y.why||'').trim()?`, why topped/not: "${String(y.why).trim()}"`:''}${String(y.fwhy||'').trim()?`, why flashed/not: "${String(y.fwhy).trim()}"`:''}`).join('; '); }
    case 'P': { if(!x||typeof x.p!=='number') return ''; const fl=Object.entries(x.flags||{}).filter(([,v])=>v).map(([k])=>({pop:'heard a pop',sharp:'sharp pain',swell:'swelling',bruise:'bruising',bow:'finger lifts when crimping',rom:'can\u2019t fully bend or straighten'}[k]||k));

function exportDays(range){ const D=[]; const start=range?dAdd(todayStr,-range+1):null; Object.values(S.months).forEach(mo=>Object.keys((mo&&mo.days)||{}).forEach(d=>{ const ds=`${mo.key}-${pad(+d)}`; if((!start||ds>=start)&&ds<=todayStr&&(mo.days[d]||[]).length) D.push(ds); })); return [...new Set(D)].sort(); }
function exportClaude(range){ const D=exportDays(range); if(!D.length) return '';
  const L=[`${shownName()?shownName()+'\'s ':''}CLIMB LOG (${D[0]} to ${D[D.length-1]}, ${D.length} days with logs)`,'',
    'How to read it:','- Scores are 1–10 (5 = normal for me). Finger pain is 0–10. Body ratings are 0 (fresh) to 100 (pain): 15+ tired, 40+ sore, 65+ very sore, 85+ pain.',

    `- Log types: ${S.cfg.templates.map(t=>t.name).join(', ')}.`,''];

      const tp=S.cfg.templates.find(t=>t.id===e.tid); if(tp&&tp.fingerTest){ const rv=r=>{ const fd=tp.fields.find(x=>x.role===r), it=fd&&(e.items||[]).find(i=>i.fid===fd.id), x=it?parseFloat(getP(it,'N')):NaN; return isNaN(x)?null:x; }, bw=rv('bw'), ad=rv('add'); if(bw>0&&ad!=null) lines.push(`- Finger strength: ${Math.round((bw+ad)/bw*100)}% of bodyweight (bodyweight ${bw} kg + ${ad} kg on a ${rv('edge')||20} mm edge, 10 s)`); }

function exportCSV(range){ const D=exportDays(range), q=s=>/[",\n]/.test(s)?`"${String(s).replace(/"/g,'""')}"`:String(s); const rows=[['date','weekday','log','field','part','value']];
  D.forEach(d=>{ XDAY=d; const [y,m,dd]=d.split('-'), mo=S.months[`${y}-${m}`]; (mo.days[String(+dd)]||[]).forEach(e=>(e.items||[]).forEach(it=>compsList(it).forEach(c=>{ const t=partText(it,c); if(t) rows.push([d,dayName(d),tplName(e),it.name,COMP[c],t.replace(/^"|"$/g,'')]); }))); });

function claudeCard(){ const r=S.st.xr??30, n=exportDays(r).length;
  return `<div class="card"><h3>Analyze with Claude</h3><p class="note">Take your raw log to Claude: every day, every time, every score and note you entered.</p>

  await FS.setDoc(FS.doc(fs,'uids/'+uid),{acc});
  if(oldUid&&oldUid!==uid){ try{ await FS.deleteDoc(FS.doc(fs,'uids/'+oldUid)); }catch(e){} } }
const TEAM={
  get db(){ return DB; }, get info(){ return INFO; },
  startCfg(){ const st=INFO&&INFO.setup&&Array.isArray(INFO.setup.templates)&&INFO.setup.templates.length?INFO.setup.templates:TEAM_DEFAULT.templates;
    return {templates:JSON.parse(JSON.stringify(st)),pack:1,packNo:1,bodyMig:1,routesMig:1}; },
  // the app asks for a "hash" of a new code: here that creates the code's login and returns its id
  async hash(code){ return makeLogin(code); },
  async taken(){ return false; },
  bind, uid:()=>AUTH&&AUTH.currentUser?AUTH.currentUser.uid:'',
  newId, validCode, setWho,
  async setInfo(p){ const d=Object.assign({},INFO||{},p); delete d.name; await DB.doc('team/info').set(d); INFO=Object.assign({},INFO,p); },
  logout(msg){ SESSION++; setWho(null); try{ if(msg) localStorage.setItem('ct:msg',msg); else localStorage.removeItem('ct:msg'); }catch(e){} booted=false; try{ A.signOut(AUTH); }catch(e){} fresh(); showLogin(); }
};
function fresh(){ const old=$app(), n=old.cloneNode(false); old.replaceWith(n); return n; }
function boot(w){ if(booted) return; booted=true; fresh(); const my=++SESSION;
  const T=Object.create(TEAM,{setWho:{value:x=>{ if(my===SESSION) setWho(x); }},logout:{value:m=>{ if(my===SESSION) TEAM.logout(m); }}});
  try{ bootApp({id:w.id,name:String(w.name||'Me'),role:normRole(w.role),hv:w.hv||''},T); }
  catch(e){ booted=false; showNote('Something went wrong',esc(String(e&&e.message||e)),true); } }
function card(inner){ $app().innerHTML=`<div class="gate"><div class="gcard">${inner}</div></div>`; return $app().querySelector('.gcard'); }
const LOGO='<div class="glogo" aria-hidden="true"><svg viewBox="0 0 48 48" width="52" height="52"><rect x="4" y="4" width="40" height="40" rx="11" fill="var(--ink)"/><path d="M14 34l7-11 5 6 4-7 6 12z" fill="var(--bg)"/><circle cx="31" cy="15" r="3.2" fill="#E3B31C"/></svg></div>';
function showLoading(){ card(`${LOGO}<p class="note">Loading…</p>`); }
function showNote(title,html,retry){ const c=card(`${LOGO}<h1>${esc(title)}</h1><p class="note">${html}</p>${retry?'<button class="btn gbtn" data-g="retry">Try again</button>':''}`); const b=c.querySelector('[data-g=retry]'); if(b) b.onclick=()=>start(); }
function showLogin(msg){ if(!msg){ try{ msg=localStorage.getItem('ct:msg')||''; }catch(e){} }
  const c=card(`${LOGO}<h1>${esc(PUB&&PUB.name||'Climb log')}</h1><p class="note">Enter your code to log in</p>${msg?`<p class="gmsg" role="status">${esc(msg)}</p>`:''}
    <input id="gcode" class="gcode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="current-password" aria-label="Your code" placeholder="••••••">
    <button class="btn gbtn" data-g="login">Log in</button><p class="gerr" id="gerr" role="alert"></p><p class="note">No code yet? Ask your coach.</p>`);
  const i=c.querySelector('#gcode'), go=()=>doLogin(i.value.trim(),c);
  c.querySelector('[data-g=login]').onclick=go; i.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } }; try{ i.focus(); }catch(e){} }
// who is this login? uids/<login> → account; the account must still point at this login
async function whoIs(uid){ const fs=FS.getFirestore(); const m=await FS.getDoc(FS.doc(fs,'uids/'+uid)); if(!m.exists()) return null;
  const acc=m.data().acc, a=await FS.getDoc(FS.doc(fs,'accounts/'+acc)); if(!a.exists()) return null; const d=a.data(); if(d.hash!==uid) return null;
  return {id:acc,name:String(d.name||'Me'),role:normRole(d.role),hv:uid.slice(0,12)}; }
async function doLogin(code,c){ const err=c.querySelector('#gerr'), btn=c.querySelector('[data-g=login]');
  if(!validCode(code)){ err.textContent='Codes are 6–10 digits.'; return; }
  btn.disabled=true; btn.textContent='Checking…'; err.textContent='';
  try{ if(!PUB) await loadPub(); if(!PUB){ err.textContent='This team isn’t set up yet.'; return; }
    if(fails>=3) await new Promise(r=>setTimeout(r,Math.min(8000,1000*(fails-2))));
    const cr=await creds(code); let u=null;
    try{ u=await A.signInWithEmailAndPassword(AUTH,cr.email,cr.password); }
    catch(e){ const k=String(e&&e.code||''); if(k==='auth/too-many-requests'){ err.textContent='Too many tries. Wait a few minutes.'; return; } if(k==='auth/network-request-failed'){ err.textContent='No internet. Check your connection.'; return; } u=null; }
    const w=u?await whoIs(u.user.uid):null;
    if(!w){ if(u) try{ await A.signOut(AUTH); }catch(e){} fails++; err.textContent='Wrong code. Try again.'; const i=c.querySelector('#gcode'); if(i){ i.value=''; try{ i.focus(); }catch(e){} } return; }
    fails=0; try{ localStorage.removeItem('ct:msg'); }catch(e){} await loadInfo(); setWho(w); boot(w); }
  catch(e){ err.textContent='Can’t reach the team right now. Try again.'; }
  finally{ if(btn.isConnected){ btn.disabled=false; btn.textContent='Log in'; } } }
function showSetup(resume){
  const c=card(`${LOGO}<h1>Set up your team</h1><p class="note">${resume?'Setup didn’t finish last time. Enter the same name and code to finish it.':'You’re the first one here, so you’re the <b>supervisor</b>: you log like an athlete and can do everything, adding coaches and athletes, roles and codes.'}</p>
    <div class="gform"><label>Team name<input type="text" id="gteam" maxlength="40" value="LT climbing team" autocomplete="off"></label>
      <label>Your name<input type="text" id="gname" maxlength="40" placeholder="e.g. Kajus" autocomplete="off"></label>
      <label>Your code <span class="note">6–10 digits</span><input type="text" id="gnew" inputmode="numeric" maxlength="10" placeholder="e.g. 123456" autocomplete="off"></label></div>
    <button class="btn gbtn" data-g="setup">Create team</button><p class="gerr" id="gerr" role="alert"></p>`);
  c.querySelector('[data-g=setup]').onclick=()=>doSetup(c); }
async function doSetup(c){ const v=s=>{ const el=c.querySelector(s); return el?el.value.trim():''; }, err=c.querySelector('#gerr'), btn=c.querySelector('[data-g=setup]');
  const team=v('#gteam').slice(0,40)||'LT climbing team', name=v('#gname').slice(0,40), code=v('#gnew');
  if(!name){ err.textContent='Type your name.'; return; } if(!validCode(code)){ err.textContent='The code must be 6–10 digits.'; return; }
  btn.disabled=true; btn.textContent='Creating…'; err.textContent='';
  try{ const fs=FS.getFirestore(), p0=await loadPub(); let uid, id=newId();
    if(p0&&p0.done){ showLogin('The team is already set up. Log in with your code.'); return; }
    if(p0){ // finishing a setup that stopped half way: must be the same person with the same code
      const cr=await creds(code); let u=null; try{ u=await A.signInWithEmailAndPassword(AUTH,cr.email,cr.password); }catch(e){ u=null; }
      if(!u||u.user.uid!==p0.owner){ err.textContent='Use the same code you used when you started the setup.'; return; } uid=u.user.uid; }
    else { const salt=b64(crypto.getRandomValues(new Uint8Array(16))); PUB={name:team,salt,iter:ITER};
      const cr=await creds(code), u=await A.createUserWithEmailAndPassword(AUTH,cr.email,cr.password); uid=u.user.uid;
      await FS.setDoc(FS.doc(fs,'team/public'),{name:team,salt,iter:ITER,owner:uid,created:Date.now()}); }
    let linked=null; if(p0){ try{ const x=await FS.getDoc(FS.doc(fs,'uids/'+uid)); if(x.exists()) linked=x.data().acc; }catch(e){} }
    try{ await FS.setDoc(FS.doc(fs,'team/info'),{v:1,setup:{templates:TEAM_DEFAULT.templates}}); }catch(e){ if(!p0) throw e; }   // already there when finishing
    if(linked) id=linked;
    else { await FS.setDoc(FS.doc(fs,'accounts/'+id),{name,role:'supervisor',hash:uid,created:Date.now(),by:id}); await FS.setDoc(FS.doc(fs,'uids/'+uid),{acc:id}); }
    await FS.updateDoc(FS.doc(fs,'team/public'),{done:true});   // setup is closed: nobody can make themselves supervisor this way again
    await loadInfo(); const w={id,name,role:'supervisor',hv:uid.slice(0,12)}; setWho(w); boot(w); }
  catch(e){ try{ await loadPub(); }catch(e2){} err.textContent='Couldn’t create the team. Check your connection and try again.'; }
  finally{ if(btn.isConnected){ btn.disabled=false; btn.textContent='Create team'; } } }
let started=false;
async function start(){
  showLoading();
  try{ if(!F){ [F,A,FS]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js'),import(SDK+'firebase-firestore.js')]);
      F.initializeApp(FB_CFG); AUTH=A.getAuth(); DB=mkDb(FS.getFirestore()); } }
  catch(e){ showNote('Can’t load the app','Check your internet connection and try again.',true); return; }
  // wait for a saved login on this phone
  const user=await new Promise(r=>{ const un=A.onAuthStateChanged(AUTH,u=>{ un(); r(u); }); });
  try{ await loadPub(); }catch(e){ PUB=null;
    const w=getWho(); if(user&&w&&w.hv===user.uid.slice(0,12)){ boot(w); return; }   // offline: open with what this phone has
    showNote('Can’t reach the team','Check your connection and try again.',true); return; }
  if(!PUB){ showSetup(false); return; }
  if(!PUB.done){ if(user&&user.uid===PUB.owner){ showSetup(true); return; } showNote('Not set up yet','The team isn’t ready yet. Try again in a few minutes.',true); return; }
  if(user){ let w=null; try{ w=await whoIs(user.uid); }catch(e){ const s=getWho(); if(s&&s.hv===user.uid.slice(0,12)) w=s; }
    if(w){ await loadInfo(); setWho(w); boot(w); return; }
    try{ await A.signOut(AUTH); }catch(e){} setWho(null); }
  showLogin(); }
start();
})();
